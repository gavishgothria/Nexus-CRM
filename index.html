<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus CRM — Enterprise Revenue & Customer Intelligence Platform</title>
  <meta name="description" content="Next-generation enterprise CRM combining Attio's relational speed, HubSpot's automation, and Salesforce's revenue intelligence." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div class="crm-shell" id="appShell">
    <!-- ==================== LEFT NAVIGATION SIDEBAR ==================== -->
    <aside class="crm-sidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#6366f1"/>
            <path d="M2 17L12 22L22 17" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#c7d2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-meta">
          <span class="brand-title">Nexus CRM</span>
          <span class="brand-plan">REVOPS ENTERPRISE v2.4</span>
        </div>
      </div>

      <!-- Command K Trigger -->
      <button class="cmd-trigger-btn" id="openCmdPaletteBtn" type="button" title="Open Command Palette (Cmd+K or /)">
        <span class="cmd-trigger-left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Quick command...</span>
        </span>
        <kbd>⌘K</kbd>
      </button>

      <div class="sidebar-section-label">WORKSPACE</div>
      <nav class="sidebar-nav" id="mainNav">
        <button class="nav-item active" data-view="dashboard" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span>Executive Dashboard</span>
        </button>
        <button class="nav-item" data-view="pipeline" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <span>Deal Pipeline</span>
          <span class="nav-badge" id="navDealsCount">9</span>
        </button>
        <button class="nav-item" data-view="contacts" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Contacts & Leads</span>
          <span class="nav-badge" id="navContactsCount">8</span>
        </button>
        <button class="nav-item" data-view="companies" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/><path d="M9 9h.01"/><path d="M9 13h.01"/><path d="M9 17h.01"/></svg>
          <span>Accounts (ABM)</span>
          <span class="nav-badge" id="navCompaniesCount">8</span>
        </button>
        <button class="nav-item" data-view="activities" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Activities & SLA Tasks</span>
          <span class="nav-badge warn" id="navActivitiesCount">4</span>
        </button>
      </nav>

      <div class="sidebar-section-label">INTELLIGENCE & OPS</div>
      <nav class="sidebar-nav">
        <button class="nav-item" data-view="workflows" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Automation Workflows</span>
        </button>
        <button class="nav-item" data-view="cpq" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          <span>CPQ Quote Builder</span>
        </button>
        <button class="nav-item" data-view="service" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>Service Desk & Tickets</span>
        </button>
        <button class="nav-item" data-view="analytics" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Revenue Forecasting</span>
        </button>
        <button class="nav-item" data-view="audit" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Benchmark & Self-Critique</span>
          <span class="nav-badge accent">Audit</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Schema & RBAC Settings</span>
        </button>
      </nav>

      <!-- Sidebar Footer: Role Switcher & User Profile -->
      <div class="sidebar-footer">
        <div class="rbac-switcher-box">
          <label for="roleSelect" class="rbac-label">Active RBAC Role:</label>
          <select id="roleSelect" class="rbac-select" aria-label="Switch Role-Based Access Control">
            <option value="Admin">Admin (Full Access)</option>
            <option value="Sales Manager">Sales Manager</option>
            <option value="Account Executive">Account Executive</option>
            <option value="Viewer">Read-Only Auditor</option>
          </select>
        </div>
        <div class="user-card">
          <div class="user-avatar" id="currentUserAvatar">GG</div>
          <div class="user-info">
            <div class="user-name" id="currentUserName">Gavish Gothria</div>
            <div class="user-role" id="currentUserTitle">VP of Revenue Operations</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN CONTENT AREA ==================== -->
    <div class="crm-main">
      <!-- Top Header Bar -->
      <header class="crm-topbar">
        <div class="topbar-left">
          <h1 class="view-title" id="topViewTitle">Executive Revenue Dashboard</h1>
          <span class="live-status-pill">
            <span class="pulse-dot"></span>
            Real-Time Sync
          </span>
        </div>

        <div class="topbar-right">
          <!-- Global Filter Search -->
          <div class="global-search-box">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="globalSearchInput" placeholder="Filter deals, contacts, companies..." aria-label="Global filter" />
          </div>

          <!-- Currency Selector -->
          <select id="currencySelector" class="topbar-select" aria-label="Display Currency">
            <option value="INR" selected>INR (₹)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
          </select>

          <!-- Theme Switcher -->
          <button class="icon-btn" id="themeToggleBtn" type="button" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>

          <!-- Export CSV -->
          <button class="btn btn-secondary" id="exportCsvBtn" type="button" title="Export active view to CSV">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Export CSV</span>
          </button>

          <!-- Quick Create Deal Button -->
          <button class="btn btn-primary" id="newDealBtn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Deal</span>
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="crm-viewport" id="viewContainer" tabindex="-1">
        <!-- Rendered dynamically by src/app.js -->
      </main>
    </div>
  </div>

  <!-- ==================== 360° RECORD INSPECTOR DRAWER ==================== -->
  <div class="drawer-backdrop hidden" id="inspectorBackdrop"></div>
  <aside class="inspector-drawer hidden" id="inspectorDrawer" aria-label="360 Customer Record Inspector">
    <div id="inspectorContent"></div>
  </aside>

  <!-- ==================== COMMAND PALETTE (CMD+K) ==================== -->
  <div class="modal-backdrop hidden" id="cmdBackdrop">
    <div class="cmd-modal" role="dialog" aria-modal="true" aria-label="Command Palette">
      <div class="cmd-input-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="cmdSearchInput" placeholder="Type a command or search deals, contacts, accounts..." autocomplete="off" />
        <kbd>ESC</kbd>
      </div>
      <div class="cmd-results" id="cmdResultsList"></div>
    </div>
  </div>

  <!-- ==================== UNIVERSAL CREATE / EDIT MODAL ==================== -->
  <div class="modal-backdrop hidden" id="entityModalBackdrop">
    <div class="entity-modal" role="dialog" aria-modal="true" id="entityModal">
      <div class="modal-header">
        <h3 id="entityModalTitle">Create New Record</h3>
        <button class="icon-btn" id="closeEntityModalBtn" type="button" aria-label="Close Modal">✕</button>
      </div>
      <form id="entityForm" class="modal-body"></form>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATION CONTAINER ==================== -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="src/data.js"></script>
  <script src="src/charts.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
